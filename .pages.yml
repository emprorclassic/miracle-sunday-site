# Pages CMS settings: tells the dashboard which fields to show you.
media:
  input: "images"
  output: "/images"
content:
  - name: "website"
    label: "Website content"
    type: "file"
    path: "content.json"
    fields:
      - name: "work"
        label: "Portfolio projects"
        type: "object"
        list:
          collapsible:
            summary: "{name}"
        description: "The first 4 show before \"Load more\". Drag to reorder."
        fields:
          - name: "name"
            label: "Project name"
            type: "string"
          - name: "type"
            label: "Project type (e.g. SaaS Dashboard, Mobile App)"
            type: "string"
          - name: "tools"
            label: "Built with (decides which filter tab it shows under)"
            type: "select"
            options:
              values:
                - "Figma"
                - "WordPress"
                - "Elementor"
                - "ACF"
                - "Shopify"
                - "Squarespace"
              multiple: true
          - name: "desc"
            label: "Short description"
            type: "text"
          - name: "image"
            label: "Screenshot or mockup"
            type: "image"
          - name: "link"
            label: "Live site link (leave empty if there is no live site)"
            type: "string"
          - name: "fullPage"
            label: "Full page design (long image or PDF). View Project opens it on your site"
            type: "file"
      - name: "courses"
        label: "Courses"
        type: "object"
        list:
          collapsible:
            summary: "{title}"
        fields:
          - name: "title"
            label: "Course title"
            type: "string"
          - name: "level"
            label: "Level"
            type: "select"
            options:
              values:
                - "Beginner"
                - "Intermediate"
                - "Advanced"
                - "All levels"
          - name: "lessons"
            label: "Number of lessons"
            type: "string"
          - name: "hours"
            label: "Total hours"
            type: "string"
          - name: "price"
            label: "Price (e.g. $49)"
            type: "string"
          - name: "status"
            label: "Badge (write \"Coming soon\", or leave empty when it is live)"
            type: "string"
          - name: "link"
            label: "Enroll link (write WHATSAPP to open WhatsApp)"
            type: "string"
          - name: "image"
            label: "Course cover"
            type: "image"
          - name: "icon"
            label: "Icon shown when there is no cover"
            type: "select"
            options:
              values:
                - "whatsapp"
                - "fiverr"
                - "upwork"
                - "kwork"
                - "layers"
                - "camera"
                - "code"
                - "mail"
                - "figma"
                - "wp"
                - "blocks"
                - "fields"
                - "cart"
                - "square"
                - "grid"
                - "pen"
                - "book"
                - "star"
      - name: "reviews"
        label: "Client reviews"
        type: "object"
        list:
          collapsible:
            summary: "{name}"
        fields:
          - name: "name"
            label: "Client name or username"
            type: "string"
          - name: "country"
            label: "Country"
            type: "string"
          - name: "project"
            label: "Project"
            type: "string"
          - name: "quote"
            label: "Review"
            type: "text"
      - name: "faqs"
        label: "FAQ"
        type: "object"
        list:
          collapsible:
            summary: "{q}"
        fields:
          - name: "q"
            label: "Question"
            type: "string"
          - name: "a"
            label: "Answer"
            type: "text"
      - name: "services"
        label: "Services"
        type: "object"
        list:
          collapsible:
            summary: "{name}"
        fields:
          - name: "name"
            label: "Service"
            type: "string"
          - name: "desc"
            label: "Description"
            type: "text"
          - name: "tools"
            label: "Tools"
            type: "select"
            options:
              values:
                - "Figma"
                - "WordPress"
                - "Elementor"
                - "ACF"
                - "Shopify"
                - "Squarespace"
              multiple: true
      - name: "steps"
        label: "Process steps"
        type: "object"
        list: true
        fields:
          - name: "title"
            label: "Step"
            type: "string"
          - name: "body"
            label: "Description"
            type: "string"
      - name: "stats"
        label: "Numbers (stats)"
        type: "object"
        list: true
        fields:
          - name: "value"
            label: "Number"
            type: "number"
          - name: "decimals"
            label: "Decimal places (0 or 1)"
            type: "number"
          - name: "suffix"
            label: "After the number (+, ★, hr)"
            type: "string"
          - name: "label"
            label: "Label"
            type: "string"
      - name: "tags"
        label: "Hero arrow list"
        type: "string"
        list: true
      - name: "whatsapp"
        label: "WhatsApp number (digits only, with country code, e.g. 2348012345678)"
        type: "string"
      - name: "whatsappMessage"
        label: "WhatsApp opening message"
        type: "text"
      - name: "email"
        label: "Email"
        type: "string"
      - name: "bookingUrl"
        label: "Calendly link for Book a Free Consultation (e.g. https://calendly.com/yourname/free-consultation)"
        type: "string"
      - name: "contactFormKey"
        label: "Web3Forms access key (makes the contact form email you)"
        type: "string"
      - name: "platforms"
        label: "Profile card platforms"
        type: "object"
        list:
          collapsible:
            summary: "{name}"
        fields:
          - name: "name"
            type: "string"
          - name: "icon"
            type: "select"
            options:
              values:
                - "whatsapp"
                - "fiverr"
                - "upwork"
                - "kwork"
                - "layers"
                - "camera"
                - "code"
                - "mail"
                - "figma"
                - "wp"
                - "blocks"
                - "fields"
                - "cart"
                - "square"
                - "grid"
                - "pen"
                - "book"
                - "star"
          - name: "note"
            label: "Small note (e.g. 5.0 ★)"
            type: "string"
          - name: "url"
            label: "Link"
            type: "string"
      - name: "socials"
        label: "Footer links"
        type: "object"
        list:
          collapsible:
            summary: "{name}"
        description: "Write WHATSAPP as the link to use your WhatsApp number."
        fields:
          - name: "name"
            type: "string"
          - name: "icon"
            type: "select"
            options:
              values:
                - "whatsapp"
                - "fiverr"
                - "upwork"
                - "kwork"
                - "layers"
                - "camera"
                - "code"
                - "mail"
                - "figma"
                - "wp"
                - "blocks"
                - "fields"
                - "cart"
                - "square"
                - "grid"
                - "pen"
                - "book"
                - "star"
          - name: "url"
            label: "Link"
            type: "string"
      - name: "workTabs"
        label: "Portfolio filter tabs"
        type: "object"
        list: true
        description: "Keep \"All\" first. A project shows under a tab when its \"Built with\" matches the tab name."
        fields:
          - name: "name"
            type: "string"
          - name: "icon"
            type: "select"
            options:
              values:
                - "whatsapp"
                - "fiverr"
                - "upwork"
                - "kwork"
                - "layers"
                - "camera"
                - "code"
                - "mail"
                - "figma"
                - "wp"
                - "blocks"
                - "fields"
                - "cart"
                - "square"
                - "grid"
                - "pen"
                - "book"
                - "star"
      - name: "tools"
        label: "Tools list"
        type: "string"
        list: true
      - name: "_note"
        label: "Note"
        type: "string"
        readonly: true
 
